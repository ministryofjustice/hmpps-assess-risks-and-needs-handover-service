services:
  aap-ui:
    environment:
      INGRESS_URL: http://aap-ui:3000
      TOKEN_VERIFICATION_API_URL: http://hmpps-auth:9090/verification
      HMPPS_AUTH_EXTERNAL_URL: http://hmpps-auth:9090/auth
      HMPPS_ARNS_HANDOVER_EXTERNAL_URL: http://arns-handover:7070

  arns-handover:
    environment:
      HMPPS_HANDOVER_BASE_URL: http://arns-handover:7070
      HMPPS_HANDOVER_EXTERNAL_URL: http://arns-handover:7070
      CLIENT_SP_OAUTH_REDIRECT_URI: http://aap-ui:3000/sign-in/handover/callback
      CLIENT_SP_HANDOVER_REDIRECT_URI: http://aap-ui:3000/sign-in/handover?service=sentence-plan
      CLIENT_SAN_OAUTH_REDIRECT_URI: http://aap-ui:3000/sign-in/handover/callback
      CLIENT_SAN_HANDOVER_REDIRECT_URI: http://aap-ui:3000/sign-in/handover?service=strengths-and-needs
      OASYS_BASE_URL: http://aap-ui:3000
      OASYS_RETURN_URLS: http://aap-ui:3000
      HMPPS_AUTH_BASE_URL: http://hmpps-auth:9090
      SERVER_ERROR_WHITELABEL_ENABLED: true

  playwright:
    image: mcr.microsoft.com/playwright:v1.65.1-noble
    networks:
      - hmpps
    volumes:
      - ../e2e:/e2e
      - /e2e/node_modules
    working_dir: /e2e
    environment:
      CI: ${CI:-}
      BASE_URL: http://aap-ui:3000
    ipc: host
    entrypoint: ["/bin/bash", "-c", "npm ci --no-audit --no-fund && npx playwright test \"$$@\"", "--"]

networks:
  hmpps:
